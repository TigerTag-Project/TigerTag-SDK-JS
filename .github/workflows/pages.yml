name: Publish the SDK site

# Builds site/ (one static page per language, see site/build.py) and publishes it
# on GitHub Pages: https://tigertag-project.github.io/TigerTag-SDK-JS/
#
# Exactly one workflow deploys this site, and this is it.
# Prerequisite, once: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'llms.txt'
      - 'assets/favicon.svg'
      - 'assets/apple-touch-icon.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the page's dateModified comes from git
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Every language must have every key, and every code sample must be in the README.
      - name: Check the translations and code samples
        run: python site/build.py --check

      - name: Build the site
        run: python site/build.py --out _site

      # Search / answer-engine essentials (.agents/rules/seo-geo.md): no deploy
      # with a broken hreflang set, a missing title or invalid JSON-LD.
      - name: Check the site for search and answer engines
        run: python site/seo_check.py _site

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

      # The published result, not this workflow's green tick: every language answers.
      - name: The published site answers in every language
        run: |
          set -euo pipefail
          base="${{ steps.deploy.outputs.page_url }}"
          for lang in "" fr/ de/ es/ it/ zh/ pt/ pt-pt/ pl/ ru/ nl/; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${lang}") && [ "$code" = 200 ] && break
              sleep 10
            done
            echo "${base}${lang} -> ${code}"
            [ "$code" = 200 ]
          done
